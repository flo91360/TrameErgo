[package]
name = "trameergo"
version = "1.2.1"
description = "Bilans d'ergothérapie : application Windows (Tauri) de TrameErgo"
edition = "2021"
publish = false

[lib]
name = "trameergo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
