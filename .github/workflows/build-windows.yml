name: Windows .exe

# Compile TrameErgo sous Windows (Qt 6, MinGW, ActiveQt pour Word), fabrique
# l'installateur et publie la Release v<VERSION du .pro> quand une nouvelle
# version arrive sur main. PlaniFiKateur exige le job « build » avant de fusionner
# une PR et archive les .exe de chaque Release dans Google Drive.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path TrameErgo.pro -Pattern '^VERSION\s*=\s*(\d+\.\d+\.\d+)\s*$'
          if (-not $match) { throw "VERSION = x.y.z absente de TrameErgo.pro" }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Installer Qt 6 (MinGW, ActiveQt)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtactiveqt
          tools: tools_mingw1310
          cache: true

      - name: Ajouter le compilateur MinGW au PATH
        shell: pwsh
        run: |
          $bin = Join-Path $env:IQTA_TOOLS 'mingw1310_64\bin'
          if (-not (Test-Path (Join-Path $bin 'g++.exe'))) { throw "MinGW introuvable : $bin" }
          $bin >> $env:GITHUB_PATH

      - name: Compiler
        shell: pwsh
        run: |
          g++ --version
          qmake TrameErgo.pro CONFIG+=release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          mingw32-make -j4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path release\TrameErgo.exe)) { throw "release\TrameErgo.exe absent" }

      - name: Rassembler l'application et ses modèles Word
        shell: pwsh
        run: |
          New-Item -ItemType Directory deploy | Out-Null
          Copy-Item release\TrameErgo.exe deploy\
          windeployqt --release --no-translations --compiler-runtime deploy\TrameErgo.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item arborescence deploy\arborescence -Recurse

      - name: Fabriquer l'installateur
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" '/DSourceDir=..\deploy' installer\TrameErgo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: TrameErgo-windows
          path: Output/TrameErgo-Installation-*.exe
          if-no-files-found: error

      # Une version déjà publiée n'est jamais remplacée : PlaniFiKateur archive
      # chaque Release dans Google Drive et refuse d'écraser une version.
      - name: Vérifier si la version est déjà publiée
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Version v${{ steps.version.outputs.version }} déjà publiée : rien à publier. Augmenter VERSION dans TrameErgo.pro pour une nouvelle Release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TrameErgo ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Télécharger **TrameErgo-Installation-${{ steps.version.outputs.version }}.exe** puis lancer l'installation (Microsoft Word est nécessaire).
            Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* puis *Exécuter quand même*.
          files: Output/TrameErgo-Installation-*.exe
