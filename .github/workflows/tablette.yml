name: Application tablette et Windows

# Teste et construit l'application (tablette/) : version web publiée sur GitHub
# Pages depuis main, et version Windows (Tauri) dont l'installateur est un
# artefact de l'exécution, publié dans la Release v<version de package.json>
# quand une nouvelle version arrive sur main. Les tests remplissent le vrai
# modèle bilan.docx. PlaniFiKateur exige le job « build » avant de fusionner
# une PR et archive les .exe de chaque Release dans Google Drive.
# Un commit de PR n'est construit qu'une fois (événement pull_request) ; les
# push ne déclenchent la CI que sur main.
# Actions en versions qui tournent sur Node 24 (Node 20 est retiré des runners).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: tablette-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tablette:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tablette
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablette/package-lock.json

      # Version identique partout, et notée dans CHANGELOG.md avant d'être publiée.
      - name: Vérifier la version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          verrou=$(grep -A1 '^name = "trameergo"$' src-tauri/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          erreur=0
          [ "$cargo" = "$version" ] || { echo "::error::src-tauri/Cargo.toml ($cargo) ≠ package.json ($version)"; erreur=1; }
          [ "$verrou" = "$version" ] || { echo "::error::src-tauri/Cargo.lock ($verrou) ≠ package.json ($version)"; erreur=1; }
          grep -q "^## \[$version\]" ../CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section [$version]"; erreur=1; }
          exit $erreur

      - name: Installer
        run: npm ci

      - name: Tester (remplit le vrai modèle Word)
        run: npm test

      - name: Construire
        run: npm run build

      # Parcours complets sur l'application construite, jusqu'au Word téléchargé.
      - name: Parcours dans le navigateur (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: tablette/dist

  # Application Windows : la même application empaquetée par Tauri (WebView2),
  # installateur NSIS à télécharger dans les artefacts de l'exécution.
  build:
    # Jamais d'installateur (ni de Release) sans tests verts.
    needs: tablette
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tablette
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablette/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tablette/src-tauri -> target

      - name: Installer
        run: npm ci

      - name: Lire la version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Construire l'installateur Windows
        run: npx tauri build

      - name: Nommer l'installateur
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe)
          if ($exe.Count -ne 1) { throw "Un installateur attendu, $($exe.Count) trouvé(s)" }
          New-Item -ItemType Directory installateur | Out-Null
          Copy-Item $exe[0].FullName "installateur\TrameErgo-Installation-${{ steps.version.outputs.version }}.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: TrameErgo-Windows-Tauri
          path: tablette/installateur/*.exe
          if-no-files-found: error

      # Une version déjà publiée n'est jamais remplacée : PlaniFiKateur archive
      # chaque Release dans Google Drive et refuse d'écraser une version.
      - name: Vérifier si la version est déjà publiée
        id: published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Version v${{ steps.version.outputs.version }} déjà publiée : rien à publier. Augmenter version dans tablette/package.json pour une nouvelle Release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TrameErgo ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Télécharger **TrameErgo-Installation-${{ steps.version.outputs.version }}.exe** puis lancer l'installation (aucun droit administrateur n'est demandé).
            Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* puis *Exécuter quand même*.
          files: tablette/installateur/*.exe

  # Pages doit être activé une fois : Settings > Pages > Source « GitHub Actions ».
  publier:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tablette
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
