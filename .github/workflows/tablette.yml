name: Application tablette et Windows

# Teste et construit l'application (tablette/) : version web publiée sur GitHub
# Pages depuis main, et version Windows (Tauri) dont l'installateur est un
# artefact de l'exécution. Les tests remplissent le vrai modèle bilan.docx.
on:
  push:
    branches: ['**']
    paths: ['tablette/**', 'contenu/**', '.github/workflows/tablette.yml']
  pull_request:
    branches: [main]
    paths: ['tablette/**', 'contenu/**', '.github/workflows/tablette.yml']
  workflow_dispatch:

concurrency:
  group: tablette-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tablette:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tablette
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablette/package-lock.json

      - name: Installer
        run: npm ci

      - name: Tester (remplit le vrai modèle Word)
        run: npm test

      - name: Construire
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: tablette/dist

  # Application Windows : la même application empaquetée par Tauri (WebView2),
  # installateur NSIS à télécharger dans les artefacts de l'exécution.
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tablette
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tablette/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tablette/src-tauri -> target

      - name: Installer
        run: npm ci

      - name: Construire l'installateur Windows
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: TrameErgo-Windows-Tauri
          path: tablette/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Pages doit être activé une fois : Settings > Pages > Source « GitHub Actions ».
  publier:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tablette
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
